name: Release

# Push a tag like v0.1.2 to build and publish a release:
#   git tag v0.1.2 && git push origin v0.1.2
# Running it by hand (workflow_dispatch) builds everything without publishing.
#
# Asset names are a contract with install.sh, install.ps1 and the in-app
# updater (crates/core/src/update.rs):
#   opentern-<target>.tar.gz (Linux, holding opentern-<target>/opentern)
#   Opentern-macos-universal.zip (Opentern.app) and .dmg
#   Opentern-windows-{x64,arm64}.zip (opentern.exe at the root) and
#   Opentern-windows-setup.exe, plus SHA256SUMS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux-${{ matrix.target }}
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low (2.35).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libgtk-3-dev
      - run: ./scripts/package-linux.sh ${{ matrix.target }}
      - name: The tarball runs
        run: |
          tar -xzf dist/opentern-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/opentern-${{ matrix.target }}/opentern" --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: dist/*.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
      - run: ./scripts/bundle-macos.sh "${GITHUB_REF_NAME#v}"
      - name: The app runs
        run: dist/Opentern.app/Contents/MacOS/opentern --version
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Opentern-macos-universal.dmg
            dist/Opentern-macos-universal.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build zips and installer
        shell: pwsh
        run: ./scripts/package-windows.ps1 "${{ github.ref_name }}"
      - name: Zips hold opentern.exe at the root (the in-app updater expects it), and it runs
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($arch in 'x64', 'arm64') {
            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist/Opentern-windows-$arch.zip"))
            $names = @($zip.Entries.FullName); $zip.Dispose()
            Write-Host "${arch}: $($names -join ', ')"
            if ($names -notcontains 'opentern.exe') { throw "opentern.exe isn't at the root of the $arch zip" }
          }
          $out = Join-Path $env:RUNNER_TEMP 'version.txt'
          Start-Process target/x86_64-pc-windows-msvc/release/opentern.exe -ArgumentList '--version' -Wait -NoNewWindow -RedirectStandardOutput $out
          $version = (Get-Content $out -Raw).Trim()
          Write-Host "built: $version"
          if ($version -notmatch '^opentern \d+\.\d+\.\d+$') { throw "--version failed: '$version'" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Opentern-windows-setup.exe
            dist/Opentern-windows-x64.zip
            dist/Opentern-windows-arm64.zip

  publish:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: linux-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts
      - name: Checksums
        run: |
          cp install.sh install.ps1 artifacts/
          cd artifacts && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
