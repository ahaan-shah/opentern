name: Release

# Push a tag like v0.1.0 to build and publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
# Running it by hand (workflow_dispatch) builds the tarball without publishing.
#
# Linux x86-64 only for now. The asset name is a contract with install.sh and
# the in-app updater (crates/core/src/update.rs): opentern-<target>.tar.gz
# holding opentern-<target>/opentern, plus SHA256SUMS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Ubuntu 22.04 keeps the glibc requirement low (2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libgtk-3-dev
      - run: ./scripts/package-linux.sh x86_64-unknown-linux-gnu
      - name: The tarball runs
        run: |
          tar -xzf dist/opentern-x86_64-unknown-linux-gnu.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/opentern-x86_64-unknown-linux-gnu/opentern" --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  publish:
    needs: [linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts
      - name: Checksums
        run: |
          cp install.sh artifacts/
          cd artifacts && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
