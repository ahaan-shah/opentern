[workspace]
resolver = "3"
members = ["crates/core", "crates/data", "crates/series", "crates/script", "crates/engine", "crates/pine", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ahaan Shah"]
repository = "https://github.com/ahaan-shah/opentern"
homepage = "https://github.com/ahaan-shah/opentern"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# The crash shield (catch_unwind around every frame) needs unwinding.
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

# Optimized but quick to build, for day-to-day iteration:
#   cargo run --profile fast
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
panic = "unwind"
