[package]
name = "opentern-data"
description = "Market data for Opentern: providers (Binance, Yahoo, demo), bar cache, resampling, live streams"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
crossbeam-channel = "0.5.15"
flate2 = "1.1"
jiff = "0.2.37"
opentern-core = { version = "0.1.3", path = "../core" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
tungstenite = { version = "0.28.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = "3.4.2"

[dev-dependencies]
tempfile = "3.27.0"
